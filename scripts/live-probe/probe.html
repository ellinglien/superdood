<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live probe</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #ddd; }
  header { padding: 8px 12px; display: flex; gap: 12px; align-items: center; }
  nav { padding: 8px 12px 0; display: flex; gap: 6px; overflow-x: auto; }
  nav button { flex: none; padding: 6px 10px; font: inherit; border: 1px solid #888; border-radius: 6px; background: #f4f4f4; }
  nav button[aria-pressed="true"] { background: #222; color: #fff; }
  #wrap { position: relative; margin: 0 auto; height: min(calc(100vh - 88px), calc(100vw * 4 / 3)); aspect-ratio: 3 / 4; }
  canvas { display: block; height: 100%; width: 100%; }
  #page { background: #fff; }
  #ink { position: absolute; inset: 0; touch-action: none; }
  #delay { position: fixed; right: 8px; bottom: 6px; font-size: 12px; color: #555; }
  #tip { padding: 0 12px 4px; font-size: 12px; color: #555; }
</style>
<nav id="brushes"></nav>
<header><button id="undo">Undo</button><span id="status">Loading the brushes…</span></header>
<div id="tip" hidden>Apple Pencil: turn off Scribble in Settings.</div>
<span id="delay"></span>
<div id="wrap"><canvas id="page"></canvas><canvas id="ink"></canvas></div>
<script src="textures.js"></script><script src="engine.js"></script>
<!-- The app's own engine, compiled to WebAssembly (web/engine; bash web/engine/build.sh), where the browser runs WebAssembly GC. -->
<script src="mbd-engine.wasm-runtime.js"></script><script src="mbd-engine.js"></script><script src="live.js"></script>
<!-- A module, so the page's names don't meet the engine's globals (grow, lay, …). -->
<script type="module">

// Strokes are drawn by the app's own engine compiled to WebAssembly (web/engine: P, a page of the app's, its Wash and Ink

pageCanvas.width = canvas.width = W; pageCanvas.height = canvas.height = H; ctx.lineCap = ctx.lineJoin = "round";
pageCtx.fillStyle = "#fff"; pageCtx.fillRect(0, 0, W, H);
// The first-launch toolbar, as ToolSlots.FIRST (name, code, size px, grey as darkness); test_relay checks they agree.

  ["Steady line", "steady-line.M00il00000000at_000zz0000000000000_0_00r_1jz_84w0000000000000000nz0.51j8ud", 3, 1.0],
  ["Verve felt", "verve-felt.M30i0776o0q00u1_000zz0000920000000_0_d00_0_8i00000zz0000400000nz0.jjds6x", 4, 1.0],
  ["Fude fountain", "fude-fountain.M20ss007700003m_000zzat00000000000_0_000_0_8at0000i000ll000000nz01.1s13pn4", 2.5, 1.0],
  ["Ink wash", "ink-wash.M60i0000000007q_1wva200000000_0_0fk_7_8zz0000000000000000nz0.t4mf73", 130, 0.176],
  ["Watercolour washy", "watercolour-washy.M60i04o4b0000ji_1zz8t00ag9600_1zzex_000_7js_8zz0000000000000000zz0.1s13pn4", 169, 0.082],
  ["Rob boss", "rob-boss.M99vleei0000000005e_2zg00_2llydzzn7_000_7ne_1ss0000000000000000nz0.2fu", 96, 1.0],
  ["Fill in", "fill-in.M30wd00000000at_1atat00000000_5zz_000_0_0000000000000000000nz0.2fh", 2.5, 1.0],
  ["Ben-Day brush", "ben-day-brush.Me1zzeezz00000000ll_0i0000000000000000zz065ji000at_0_000_0_25ess00000000000000nz0.2ef", 12, 1.0],
  ["High lighter", "high-lighter.M31e1zzp60000000000_1007700000000zz2_0_000_0_0000000000000000000nz0.2f2", 34, 0.102]];

// Sealed with the link's key after its # (none: none) by the app's engine, as live.html: with the JS copy too, where it loads.
const crypt = (E || await MBDEngine.load("mbd-engine.wasm", "mbd-assets.bin").catch(() => null))?.crypt(decodeURIComponent(location.hash.slice(1)));

}
// A stroke with the brush code: the app's engine's (its changes pulled as they are drawn) or the JS copy's.
function newStroke(code, size, grey) {

// The page as it shows: the engine keeps the Manta's layers and kind planes (planes.js); S.shown stacks them, kept up to

const shown = () => S.shown || S.page;
await loadTextures();
let brush = 0;
const nav = document.getElementById("brushes");
BRUSHES.forEach(([name], i) => { const b = nav.appendChild(document.createElement("button")); b.textContent = name; b.onclick = () => { brush = i; pick(); }; });

pick(); status.textContent = "Draw. Each stroke goes to the Manta when you lift; the Manta's changes show here." + (P ? "" : " (JS copy of the engine)");
// An iPad: Scribble takes the Pencil's strokes for handwriting unless it is off.
if (/iPad/.test(navigator.userAgent) || navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)) document.getElementById("tip").hidden = false;
// The parts every live page shares (live.js): the change's bytes, Undo of your own, what a stroke changed, drawing a change on.
const { MOST_OWN, encode, parse, takeBack } = Live;
let live = null, sent = 0;
const own = []; // this browser's strokes, oldest first: {x, y, w, h, before, after}
const pageGreys = (x, y, w, h) => { const d = pageCtx.getImageData(x, y, w, h).data, g = new Uint8Array(w * h); for (let i = 0; i < g.length; i++) g[i] = d[4 * i]; return g; };
// Into S what the page canvas shows over a rect (this browser's Undo), so the next stroke draws over it: a plain
// picture there, every plane clear under it (planes.js planesSet). The wet paint takes it up when next used (surf.rev).
function toEngine(x, y, w, h) {
  if (P) pull(P.picture(x, y, w, h, pageGreys(x, y, w, h)));
  else planesSet(S, x, y, w, h, pageGreys(x, y, w, h));
  if (wetSeen) for (let yy = y; yy < y + h; yy++) wetSeen.set(shown().subarray(yy * W + x, yy * W + x + w), yy * W + x);
}
const union = (a, b) => !b ? a : !a ? b.slice() : [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])];
// A sample [x, y, travel, ms, tiltX, tiltY] as the Manta's pen gives one (engine.js pointerSample): an Apple Pencil's or
// any pen's pressure through the Manta's curve, and its tilt; a finger, mouse or capacitive stylus, pressure from its pace.
function sample(e) {
  const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  live.path.push(x, y, e.timeStamp - live.t0);
  return pointerSample(e, live, x, y);
}
// The stroke shows on the ink canvas as the engine lays it; at lift it goes onto the page and out.
const show = r => { if (r) { showPage(ctx, S, r); live.box = union(live.box, r); } };
// The time each input event's samples took to draw and show (for the checks: the stroke draws as the pen moves).
const drawMs = window.drawMs = [];
canvas.addEventListener("pointerdown", e => {
  if (live) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* synthetic events can't capture */ }
  const [, code, size, grey] = BRUSHES[brush];
  // found: the engine's page as the stroke found it, so only what the stroke changed goes out (send).
  // Wet paint moving waits while the pen is down (the Manta's holds still); what it changed so far goes out first.
  wetFlush();
  const found = shown().slice();
  live = { st: newStroke(code, size, grey), id: e.pointerId, box: null, path: [], t0: e.timeStamp, found };
  show(live.st.add([sample(e)]));
});
canvas.addEventListener("pointermove", e => {
  if (!live || e.pointerId !== live.id) return;
  const t = performance.now(), evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  show(live.st.add((evs.length ? evs : [e]).map(sample)));
  drawMs.push(performance.now() - t);
});
// The stroke ends at the first of pointerup, pointercancel or pointerleave (an iPad's Pencil can miss its pointerup), once.
const end = e => { if (!live || e && e.pointerId !== live.id) return; const t = performance.now(); show(live.st.end()); window.liftMs = performance.now() - t; const { box, path, found } = live; live = null; if (box) send(box, path, found); wetStart(); };
// Wet paint after lift: a slice of about 8 ms a frame (WetCanvas.step), shown at once; what it changed goes out every
// WET_SEND ms and when it rests, as the Manta sends a settling stroke's changes as they are written (no path: laid at once).
const WET_SEND = 400;
let wetSeen = null, wetBox = null, wetSent = 0, wetTicking = false;
// The app's engine: a tick at a time, ten a second as on the Manta (DryingTicker.TICK_MS), while no pen is down.
const TICK_MS = 100;
function wetStart() {
  if (P) {
    if (!P.settling || wetTicking) return;
    wetTicking = true; wetSeen ??= shown().slice();
    setTimeout(wetTick, TICK_MS); return;
  }
  if (!HOST.wet || !HOST.wet.moving() || wetTicking) return;
  wetTicking = true; wetSeen ??= shown().slice(); HOST.wet.takeDirty();
  requestAnimationFrame(wetTick);
}
function wetTick() {
  const C = HOST.wet;

    const d = pull(P.tick()), more = P.settling;
    if (d) { showPage(ctx, S, d); wetBox = union(wetBox, d); }
    if (!more || performance.now() - wetSent > WET_SEND) wetFlush();
    if (more) setTimeout(wetTick, TICK_MS); else wetTicking = false;
    return;
  }
  const next = C.step(8), d = C.takeDirty();
  if (d) { showPage(ctx, S, d); wetBox = union(wetBox, d); }

// What wet paint changed since the last send goes out (lighter too: wet paint lifts and evens out), then is seen.
function wetFlush() {
  if (!wetBox) return;
  const b = wetBox; wetBox = null; wetSent = performance.now();
  send(b, [], wetSeen);   // shown on the ink canvas as it moved; onto the page now, and out
  const x = Math.max(0, Math.floor(b[0])), y = Math.max(0, Math.floor(b[1])), w = Math.min(W - 1, Math.ceil(b[2])) - x + 1;
  for (let yy = Math.max(0, Math.floor(b[1])); yy <= Math.min(H - 1, Math.ceil(b[3])); yy++) wetSeen.set(shown().subarray(yy * W + x, yy * W + x + w), yy * W + x);
}
for (const k of ["pointerup", "pointercancel", "pointerleave"]) canvas.addEventListener(k, end);
// No scrolling, zooming or Scribble while drawing (touch-action: none on the canvas too).
canvas.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
function send(b, path, found) {
  const x = Math.max(0, Math.floor(b[0])), y = Math.max(0, Math.floor(b[1])), w = Math.min(W - 1, Math.ceil(b[2])) - x + 1, h = Math.min(H - 1, Math.ceil(b[3])) - y + 1;
  ctx.clearRect(0, 0, W, H);

  // pixels the stroke changed (Live.changed).

  pageCtx.putImageData(img, x, y);

}
async function post(raw, w, h) {

// Undo takes back only this browser's own strokes, newest first, where nothing was drawn over them since; sent as set.
function undo() {

document.getElementById("undo").onclick = undo;
addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); } });
let incoming = Promise.resolve(), received = 0, queued = 0;  // queued: arrived, not yet being laid
const events = new EventSource("/listen?history=1"), delay = document.getElementById("delay");

// What came and when, for autotest.cjs: relay's ms, arrived here, shown.
const liveLog = window.liveLog = [];

  const at = +e.lastEventId, got = Date.now(), [number, from] = e.data.split(" ", 2);
  if (from !== me) queued++;

};
async function lay(data) {

events.onerror = () => status.textContent = "Lost the relay; trying again…";
</script>

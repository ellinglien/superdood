// A dial's row (LabSettings.dialRow, its kind LabLayout.rowKind's): the label, a slider (a double tap resets it),

  const label = el("div", "dlabel", d.label); label.style.width = Ll.label + "px"; label.style.font = `700 ${Ll.DENSE}px Ukulele, Duo, monospace`;
  if (!d.active) label.classList.add("faint"); else if (d.locked) label.classList.add("small");

      box.append(wrap); placePopup(screen.querySelector(".column").getBoundingClientRect().right + Ll.split);
    };

    const options = d.kind === "SWITCH" && !d.options.length ? ["Off", "On"] : d.options;
    options.forEach((o, i) => { const s = el("button", "seg" + (i === Math.round(d.value) ? " on" : ""), o); s.style.font = `400 ${Ll.DENSE}px Ukulele, Duo, monospace`; s.style.padding = `0 ${Ll.SEGMENT_PAD}px`; s.disabled = d.locked; s.onclick = () => { if (i !== Math.round(d.value)) lab_(d.kind === "SWITCH" ? T.labFast() : T.labOption(d.dial, i)); }; middle.append(s); });
    tall(middle, Ll.SEGMENT);

// A slider (BandSlider): pressed, an Undo step starts; moved, only its knob and value change; let go, the lab is shown
// as it now stands; two taps within BandSlider's 500 ms reset its dial.
let lastTap = { dial: -1, at: 0, x: 0 };
function slider(value, lo, hi, locked, dial, row, said) {
  const s = el("div", "slider" + (locked ? " locked" : "")), knob = el("i");
  s.append(el("b"), knob); s.setAttribute("role", "slider"); s.setAttribute("aria-label", said);
  const place = v => { knob.style.left = (100 * clamp((v - lo) / (hi - lo || 1), 0, 1)) + "%"; };
  place(value);
  if (locked) return s;
  const at = e => { const r = s.getBoundingClientRect(); return lo + clamp((e.clientX - r.left) / Math.max(1, r.width), 0, 1) * (hi - lo); };
  let id = null;
  s.addEventListener("pointerdown", e => {
    e.stopPropagation();
    if (row && lastTap.dial === dial && e.timeStamp - lastTap.at <= 500 && Math.abs(e.clientX - lastTap.x) <= 3 * HOLD.slop) { lastTap.dial = -1; return lab_(T.labResetDial(dial)); }
    lastTap = { dial, at: e.timeStamp, x: e.clientX };
    id = e.pointerId; try { s.setPointerCapture(id); } catch (err) { /* synthetic */ }
    const v = at(e); place(v); T.labSlide(dial, v, 0);

  s.addEventListener("pointermove", e => {
    if (e.pointerId !== id) return;
    const v = at(e); place(v); T.labSlide(dial, v, 1);
    if (row) { const shown = s.parentNode.querySelector(".dvalue"); if (shown) shown.textContent = JSON.parse(T.lab()).open.rows.find(q => q.dial === dial)?.shown ?? shown.textContent; }
  });
  const end = e => { if (e.pointerId !== id) return; id = null; lab_(T.labSlide(dial, at(e), 2)); };
  s.addEventListener("pointerup", end); s.addEventListener("pointercancel", end);
  s.addEventListener("click", e => e.stopPropagation());

}
